services:
  bridge:
    build: .
    image: vikunja-notification-bridge:latest
    env_file: .env
    ports:
      - "127.0.0.1:18080:8080"   # local only, Caddy fronts this on the public host
    restart: unless-stopped
    # background notification publishes drain past the default 10s SIGTERM grace
    # a killed publish loses a reminder Vikunja already saw acknowledged
    stop_grace_period: 15s
